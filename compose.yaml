services:
  paseo:
    build:
      context: .
      dockerfile: Dockerfile
    image: paseo-with-agents:latest
    container_name: paseo
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      PASEO_PASSWORD: "${PASEO_PASSWORD}"
      # PASEO_HOSTNAMES: "${PASEO_HOSTNAMES}"
    volumes:
      - paseo-state:/home/paseo
      - workspace:/workspace

volumes:
  paseo-state:
  workspace:
